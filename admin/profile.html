<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profile — Admin</title><link rel="stylesheet" href="/admin/css/admin.css"></head>
<body>
<nav class="sidebar"><h2>Portfolio Management</h2>
<a href="/admin">Dashboard</a><a href="/admin/projects">Portfolio</a><a href="/admin/categories">Categories</a><a href="/admin/skills">Skills</a><a href="/admin/services">Services</a><a href="/admin/profile">Profile</a><a href="/admin/settings">Settings</a><a href="/" target="_blank">View Website</a><a href="/admin/logout">Logout</a></nav>
<main class="main">
<h1>Profile</h1>
<form id="f" style="background:#fff;padding:1.5rem;border-radius:12px;max-width:720px">
  <label>Nama</label><input name="name">
  <label>Headline</label><input name="headline" placeholder="Account Officer & Credit Analyst">
  <label>Bio Singkat</label><textarea name="short_bio"></textarea>
  <label>Bio Lengkap</label><textarea name="bio"></textarea>
  <label>Pengalaman</label><textarea name="experience"></textarea>
  <label>Email</label><input name="email" type="email">
  <label>WhatsApp</label><input name="whatsapp">
  <label>GitHub</label><input name="github">
  <label>LinkedIn</label><input name="linkedin">
  <label>Website</label><input name="website">
  <label>Lokasi</label><input name="location">
  <label>Ketersediaan</label><input name="availability">
  <p id="msg"></p>
  <button class="btn">Simpan</button>
</form>
</main>
<script src="/admin/js/admin.js"></script>
<script>
const f = document.getElementById('f');
api('/api/admin/profile').then(p => { if (!p) return; for (const k in p) { const el = f.querySelector(`[name=${k}]`); if (el) el.value = p[k] ?? ''; } });
f.addEventListener('submit', async e => {
  e.preventDefault();
  const data = Object.fromEntries(new FormData(f));
  const r = await fetch('/api/admin/profile', { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(data) });
  document.getElementById('msg').textContent = r.ok ? 'Tersimpan ✅' : 'Gagal menyimpan';
});
</script>
</body></html>
