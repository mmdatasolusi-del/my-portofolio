<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard — Admin</title>
  <link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body>
  <nav class="sidebar">
    <h2>Portfolio Management</h2>
    <a href="/admin">Dashboard</a>
    <a href="/admin/projects">Portfolio</a>
    <a href="/admin/categories">Categories</a>
    <a href="/admin/skills">Skills</a>
    <a href="/admin/services">Services</a>
    <a href="/admin/profile">Profile</a>
    <a href="/admin/settings">Settings</a>
    <a href="/" target="_blank">View Website</a>
    <a href="/admin/logout">Logout</a>
  </nav>
  <main class="main">
    <div class="topbar">
      <h1>Dashboard</h1>
      <span>Selamat datang, Admin</span>
    </div>
    <div class="cards" id="stats"><p>Memuat…</p></div>
    <h2>Recent Projects</h2>
    <table id="recent">
      <thead><tr><th>Project</th><th>Status</th><th>Updated</th></tr></thead>
      <tbody></tbody>
    </table>
    <h2 style="margin-top:2rem">Quick Actions</h2>
    <div class="actions">
      <a class="btn" href="/admin/projects/new">+ Add Project</a>
      <a class="btn secondary" href="/admin/profile">Edit Profile</a>
      <a class="btn secondary" href="/admin/services">Add Service</a>
      <a class="btn secondary" href="/admin/skills">Manage Skills</a>
      <a class="btn secondary" href="/" target="_blank">View Website</a>
    </div>
  </main>
  <script src="/admin/js/admin.js"></script>
  <script>
    api('/api/admin/stats').then(s => {
      if (!s) return;
      const items = [
        ['Total Projects', s.total], ['Published', s.published], ['Draft', s.draft],
        ['Featured', s.featured], ['Categories', s.categories], ['Services', s.services]
      ];
      document.getElementById('stats').innerHTML = items.map(([l, n]) =>
        `<div class="card"><div class="num">${n}</div><div class="label">${l}</div></div>`).join('');
    }).catch(() => document.getElementById('stats').innerHTML = '<p>Gagal memuat statistik.</p>');
    api('/api/admin/projects/recent').then(rows => {
      if (!rows) return;
      document.querySelector('#recent tbody').innerHTML = rows.length
        ? rows.map(r => `<tr><td>${r.title}</td><td>${r.status}</td><td>${r.updated_at}</td></tr>`).join('')
        : '<tr><td colspan="3">Belum ada project.</td></tr>';
    });
  </script>
</body>
</html>
