<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Categories — Admin</title><link rel="stylesheet" href="/admin/css/admin.css"></head>
<body>
<nav class="sidebar"><h2>Portfolio Management</h2>
<a href="/admin">Dashboard</a><a href="/admin/projects">Portfolio</a><a href="/admin/categories">Categories</a><a href="/admin/skills">Skills</a><a href="/admin/services">Services</a><a href="/admin/profile">Profile</a><a href="/admin/settings">Settings</a><a href="/" target="_blank">View Website</a><a href="/admin/logout">Logout</a></nav>
<main class="main">
<h1>Categories</h1>
<form id="add" style="background:#fff;padding:1rem;border-radius:12px;max-width:720px;margin-bottom:1rem">
  <label>Nama kategori</label><input name="name" required>
  <label>Urutan</label><input name="sort_order" type="number" value="0">
  <button class="btn" style="margin-top:.75rem">+ Tambah</button>
</form>
<table id="t"><thead><tr><th>Nama</th><th>Slug</th><th>Urutan</th><th>Aksi</th></tr></thead><tbody></tbody></table>
</main>
<script src="/admin/js/admin.js"></script>
<script>
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function load() {
  const rows = await api('/api/admin/categories');
  document.querySelector('#t tbody').innerHTML = rows.map(r => `<tr>
    <td>${esc(r.name)}</td><td>${esc(r.slug)}</td><td>${r.sort_order}</td>
    <td><a href="#" data-d="${r.id}">Hapus</a></td></tr>`).join('') || '<tr><td colspan="4">Belum ada kategori.</td></tr>';
}
document.getElementById('add').addEventListener('submit', async e => {
  e.preventDefault();
  const data = Object.fromEntries(new FormData(e.target));
  const r = await fetch('/api/admin/categories', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(data) });
  if (!r.ok) { const j = await r.json(); alert(j.error); }
  e.target.reset(); load();
});
document.addEventListener('click', async e => {
  const d = e.target.closest('[data-d]');
  if (d) { e.preventDefault(); if (confirm('Hapus kategori ini? Project yang memakai kategori ini akan kehilangan kategorinya.')) { await fetch(`/api/admin/categories/${d.dataset.d}`, {method:'DELETE'}); load(); } }
});
load();
</script>
</body></html>
